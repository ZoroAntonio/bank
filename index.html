<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#006446" />
    <meta name="application-name" content="SKOK Bank" />
    <meta name="apple-mobile-web-app-title" content="SKOK Bank" />
    <meta
      name="description"
      content="SKOK Bank, also known as Skok Wybrzeże Bank, provides secure online banking, personal and business accounts, cards, transfers, loans, and multi-currency services."
    />
    <meta
      name="keywords"
      content="SKOK Bank, Skok Wybrzeże Bank, Skok Wybrzeze Bank, online banking, personal banking, business banking, multi-currency banking"
    />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://www.skokwybrzeze.com/" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SKOK Bank" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://www.skokwybrzeze.com/" />
    <meta property="og:title" content="SKOK Bank | Skok Wybrzeże Bank" />
    <meta
      property="og:description"
      content="Secure personal and business banking, cards, transfers, loans, and multi-currency services from SKOK Bank."
    />
    <meta property="og:image" content="https://www.skokwybrzeze.com/skok4.png" />
    <meta property="og:image:width" content="974" />
    <meta property="og:image:height" content="940" />
    <meta property="og:image:alt" content="SKOK Bank logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SKOK Bank | Skok Wybrzeże Bank" />
    <meta
      name="twitter:description"
      content="Secure personal and business banking, cards, transfers, loans, and multi-currency services from SKOK Bank."
    />
    <meta name="twitter:image" content="https://www.skokwybrzeze.com/skok4.png" />
    <meta name="twitter:image:alt" content="SKOK Bank logo" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BankOrCreditUnion",
        "name": "SKOK Bank",
        "alternateName": ["Skok Wybrzeże Bank", "Skok Wybrzeze Bank"],
        "url": "https://www.skokwybrzeze.com/",
        "logo": "https://www.skokwybrzeze.com/skok4.png"
      }
    </script>
    <title>SKOK Bank | Skok Wybrzeże Bank</title>
    <script>
      (() => {
        const showNeutralBootstrap = () => {
          document.title = 'Loading site settings';
          const neutralIcon = 'data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Ccircle cx="32" cy="32" r="22" fill="%23006446"/%3E%3C/svg%3E';
          document.head.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((link) => {
            link.setAttribute('href', neutralIcon);
          });
        };

        try {
          const cached = JSON.parse(localStorage.getItem('site-branding:settings') || 'null');
          if (!cached || typeof cached !== 'object') {
            showNeutralBootstrap();
            return;
          }

          const setMeta = (selector, value) => {
            if (!value) return;
            document.head.querySelector(selector)?.setAttribute('content', value);
          };
          const setLink = (rel, sizes, value, type) => {
            if (!value) return;
            const link = document.head.querySelector(`link[rel="${rel}"][sizes="${sizes}"]`);
            if (!link) return;
            link.setAttribute('href', value);
            if (type) link.setAttribute('type', type);
          };

          if (typeof cached.brandName === 'string' && cached.brandName.trim()) {
            document.title = cached.brandName.trim();
            setMeta('meta[name="application-name"]', cached.brandName.trim());
            setMeta('meta[name="apple-mobile-web-app-title"]', cached.brandName.trim());
            setMeta('meta[property="og:site_name"]', cached.brandName.trim());
          }

          setLink('icon', 'any', cached.faviconIcoUrl, 'image/x-icon');
          setLink('icon', '16x16', cached.favicon16Url, 'image/png');
          setLink('icon', '32x32', cached.favicon32Url, 'image/png');
          setLink('icon', '192x192', cached.favicon192Url, 'image/png');
          setLink('apple-touch-icon', '180x180', cached.appleTouchIconUrl, 'image/png');
        } catch {
          showNeutralBootstrap();
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
